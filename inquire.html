<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kei Motors - Car Inquiry</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Kei Motors</h1>
        <nav aria-label="Main Navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="inventory.html">Inventory</a></li>
                <li><a href="inquire.html">Inquire / Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Vehicle Inquiry Form</h2>
            <p>Interested in a vehicle or booking a test drive? Fill out the form below.</p>

            <form action="#" method="post">
                <div>
                    <label for="full-name">Full Name:</label>
                    <input type="text" id="full-name" name="full_name" required>
                </div>

                <div>
                    <label for="user-email">Email Address:</label>
                    <input type="email" id="user-email" name="user_email" required>
                </div>

                <div>
                    <label for="car-model">Interested Vehicle:</label>
                    <select id="car-model" name="car_model" required>
                        <option value="">-- Please Select a Vehicle --</option>
                        <option value="rav4">2022 Toyota RAV4</option>
                        <option value="civic">2021 Honda Civic</option>
                        <option value="Range Raptor">2023 Ford Range Raptor</option>
                        <option value="outback">2020 Subaru Outback</option>
                    </select>
                </div>

                <div>
                    <label for="inquiry-type">Inquiry Type:</label>
                    <input type="radio" id="test-drive" name="inquiry_type" value="test_drive">
                    <label for="test-drive">Book Test Drive</label>
                    
                    <input type="radio" id="quote" name="inquiry_type" value="price_quote">
                    <label for="quote">Request Price Quote</label>
                </div>

                <div>
                    <label for="user-message">Additional Notes:</label>
                    <textarea id="user-message" name="user_message" rows="4"></textarea>
                </div>

                <button type="submit">Submit Inquiry</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Kei Motors. All rights reserved.</p>
    </footer>

</body>
</html>
